[project]
name = "gridwatch"
version = "0.1.0"
description = "Electricity carbon analytics for Great Britain, the UAE, the GCC, the UK and the EU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Farah Sharif" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "dbt-core~=1.11",
    "dbt-duckdb~=1.11.0",
    "duckdb~=1.5.5",
    "holidays~=0.105",
    "httpx~=0.28.1",
    "jinja2~=3.1.6",
    "numpy~=2.3",
    "plotly~=7.1.0",
    "polars~=1.44.2",
    "pyarrow~=25.0.1",
    "scikit-learn~=1.9.1",
]

[project.scripts]
gridwatch = "gridwatch.cli:main"

[dependency-groups]
dev = [
    "mypy~=2.3.1",
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "pytest-socket~=0.8.1",
    "ruff~=0.16.9",
]
screenshot = [
    "playwright~=1.63.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridwatch"]

# Ship the dbt project inside the package so an installed wheel can build the warehouse.
# Only source folders are listed, never dbt's target or log output.
[tool.hatch.build.targets.wheel.force-include]
"dbt/dbt_project.yml" = "gridwatch/dbt_project/dbt_project.yml"
"dbt/profiles.yml" = "gridwatch/dbt_project/profiles.yml"
"dbt/macros" = "gridwatch/dbt_project/macros"
"dbt/models" = "gridwatch/dbt_project/models"
"dbt/seeds" = "gridwatch/dbt_project/seeds"
"dbt/tests" = "gridwatch/dbt_project/tests"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PTH",  # prefer pathlib
    "DTZ",  # timezone-aware datetimes
    "N",    # naming
    "C4",   # comprehensions
    "PT",   # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "plotly.*", "dbt.*", "pytest_socket", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket"
markers = [
    "integration: builds the dbt project against recorded fixtures (slower, still no network)",
]
filterwarnings = [
    "error::DeprecationWarning:gridwatch.*",
]

[tool.coverage.run]
source = ["gridwatch"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
