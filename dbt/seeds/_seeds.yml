version: 2

seeds:
  - name: gb_regions
    description: >
      Region ids used by the Carbon Intensity API regional endpoints (14 DNO regions and
      4 aggregates), with the nation each belongs to.
    columns:
      - name: region_id
        data_tests: [not_null, unique]

  - name: fuels
    description: Fuel codes in the API generation mix and how gridwatch groups them.
    columns:
      - name: fuel
        data_tests: [not_null, unique]

  - name: countries
    description: Ember areas compared in the international analysis.
    columns:
      - name: country_code
        data_tests: [not_null, unique]
      - name: ember_area
        data_tests: [not_null, unique]

  - name: uk_bank_holidays
    description: >
      England and Wales bank holidays, generated by scripts/generate_bank_holidays.py
      from the `holidays` package.
    columns:
      - name: holiday_date
        data_tests: [not_null]

  - name: known_source_gaps
    description: >
      Half-hours the API itself does not serve, found when the history was first loaded.
      The no_half_hour_gaps test allows these and fails on any new gap.
    columns:
      - name: dataset
        data_tests: [not_null]
